name: Bug report
description: Something is broken in the demo, scripts, or docs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove API keys, personal paths, and private media before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Open ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voice pipeline (Piper/Rhubarb)
        - Anime-cel render
        - ReelMimic app
        - OpenCode adapter
        - Bootstrap/scripts
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Node, Python, FFmpeg, Chrome, ReelMimic agent
      placeholder: Node 22.18, Python 3.12, FFmpeg 7, Chrome 140, OpenCode v2.2.6
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste only the relevant lines. Do not paste secrets.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets, API keys, and private media from this report.
          required: true
        - label: I searched existing issues.
          required: true
