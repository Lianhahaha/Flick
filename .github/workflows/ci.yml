name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile voice/mouth_map.py voice/tts_lipsync.py voice/demo/build_demo.py voice/anime-demo/make_mouth.py
      - run: python -m pytest -q

  node:
    name: Node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: voice/anime-demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: voice/anime-demo/package-lock.json
      - run: npm ci
      - run: node --check render.mjs
      - run: |
          for f in src/*.js src/scenes/*.js; do
            node --check "$f"
          done

  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check.ps1
